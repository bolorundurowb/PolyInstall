# yaml-language-server: $schema=https://polyinstall.dev/schema/v1.json
metadata:
  name: SampleApp
  version: 0.1.0
  publisher: Example
build:
  output_dir: dist
  compression: brotli
  targets:
    - windows-x64
  windows:
    install_scope: user
    register_arp: true
  # linux:
  #   package: appimage   # requires Linux host + mksquashfs (squashfs-tools)
  # macos:
  #   package: dmg        # requires macOS host + hdiutil
ui:
  theme: system
  # Optional branding image shown in installer top-left.
  # Supports SVG and raster files; path is resolved from extracted payload at install time.
  # logo_path: "branding/logo.svg"
  wizard_steps:
    - type: welcome
      title: Welcome
    - type: destination
      title: Install location
      default_path: "{UserHome}/SampleApp"
    - type: progress
      title: Installing
    - type: finish
      title: Complete
files:
  - source_dir: sample-payload
    include:
      - "**/*"
