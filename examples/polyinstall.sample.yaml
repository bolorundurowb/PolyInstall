# yaml-language-server: $schema=https://bolorundurowb.github.io/PolyInstall/schema/v1.json
metadata:
  name: SampleApp
  version: 0.1.0
  publisher: Example
build:
  output_dir: dist
  # Optional: customize the output filename with placeholders {name}, {version}, {target}.
  # Defaults to "{name}-{target}" if not set.
  # output_name: "{name}-v{version}-{target}"
  compression: brotli
  targets:
    - windows-x64
  windows:
    install_scope: user
    # When true (default), publish PolyInstall.Uninstall into the same stubs/<rid>/ folder before `polyinstall build` (README).
    register_arp: true
  # linux:
  #   package: appimage   # requires Linux host + mksquashfs (squashfs-tools)
  # macos:
  #   package: dmg        # requires macOS host + hdiutil
  # Optional: omit build.signing to produce unsigned installers.
  # signing:
  #   windows:
  #     certificate_path: "${WINDOWS_CERT_PATH}"      # or certificate_thumbprint / certificate_subject
  #     certificate_password_env: WINDOWS_CERT_PASSWORD
  #     timestamp_url: "http://timestamp.digicert.com"
  #   macos:
  #     identity: "Developer ID Application: Example Corp"
  #     keychain: "${MACOS_KEYCHAIN_PATH}"
  #     notarization_profile: "polyinstall-notary"    # optional; requires macos.package: dmg
ui:
  theme: system
  # Optional branding image shown in installer top-left.
  # Supports SVG and raster files; path is resolved from extracted payload at install time.
  # logo_path: "branding/logo.svg"
  wizard_steps:
    - type: welcome
      title: Welcome
    - type: destination
      title: Install location
      default_path: "{UserHome}/SampleApp"
    - type: features
      title: Select Features
    - type: progress
      title: Installing
    - type: finish
      title: Complete
# Optional features that the user can pick during install. Files, tasks, and file_associations
# without a `features:` reference are always installed (core). Backward compatible: if you omit
# the `features:` list entirely, every file/task/association is treated as core (full install).
features:
  - id: docs
    name: Documentation
    description: Install the bundled documentation.
    default_selected: true
files:
  # Core file — always installed regardless of selected features.
  - source_dir: sample-payload
    include:
      - "hello.txt"
  # Optional "docs" feature payload.
  - source_dir: sample-payload
    include:
      - "docs/**/*"
    features: [docs]
# Optional background services/daemons. Services are registered after files are copied
# and removed automatically during uninstall. Always add `require` so each entry only
# runs on the intended platform.
