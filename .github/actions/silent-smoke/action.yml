name: Silent install smoke
description: >-
  Builds a minimal silent-mode installer with the given PolyInstall CLI and stubs, runs it end to end, then checks
  that a wizard stub also honours --silent and that invalid arguments exit 2. Shared by CI (per-PR regression
  coverage) and the release workflow (post-publish smoke on the real zips).

inputs:
  polyinstall-path:
    description: Full path to the polyinstall executable to drive the build with.
    required: true
  stubs-dir:
    description: Stubs root containing one <rid>/ folder with PolyInstall.Runtime(.Silent) for the manifest target.
    required: true
  manifest-target:
    description: Manifest build.targets token for the host platform (e.g. windows-x64, linux-x64, osx-arm64).
    required: true
  work-dir:
    description: Scratch directory for the generated manifest, payload, and installers. Defaults under runner.temp.
    required: false

runs:
  using: composite
  steps:
    - id: smoke
      name: Build and run a silent installer
      shell: pwsh
      env:
        POLYINSTALL_PATH: ${{ inputs.polyinstall-path }}
        STUBS_DIR: ${{ inputs.stubs-dir }}
        MANIFEST_TARGET: ${{ inputs.manifest-target }}
        INPUT_WORK_DIR: ${{ inputs.work-dir }}
      run: |
        $ErrorActionPreference = 'Stop'

        # PowerShell's '&' call operator does not reliably block for a WinExe-subsystem process (the wizard
        # stub, PolyInstall.Runtime, built with ui.mode: wizard): it can return before the child actually
        # finishes, leaving $LASTEXITCODE empty and racing ahead of the install. Process.WaitForExit() blocks
        # correctly for every stub subsystem, so every stub invocation below goes through this helper instead
        # of '&'.
        function Invoke-Stub {
          param(
            [Parameter(Mandatory)] [string] $Path,
            [string[]] $Arguments = @()
          )

          $psi = [System.Diagnostics.ProcessStartInfo]::new($Path)
          foreach ($argument in $Arguments) { $psi.ArgumentList.Add($argument) }
          $psi.UseShellExecute = $false

          $process = [System.Diagnostics.Process]::Start($psi)
          $process.WaitForExit()
          return $process.ExitCode
        }

        $polyinstallPath = $env:POLYINSTALL_PATH
        $stubsDir = $env:STUBS_DIR
        $target = $env:MANIFEST_TARGET
        $work = $env:INPUT_WORK_DIR
        if ([string]::IsNullOrEmpty($work)) {
          $work = Join-Path $env:RUNNER_TEMP 'polyinstall-silent-smoke'
        }

        if (!(Test-Path -LiteralPath $polyinstallPath)) {
          throw "polyinstall executable not found: $polyinstallPath"
        }

        if (Test-Path -LiteralPath $work) { Remove-Item -LiteralPath $work -Recurse -Force }
        New-Item -ItemType Directory -Path $work | Out-Null
        $manifestPath = Join-Path $work 'silent.yaml'
        $payloadDir = Join-Path $work 'payload'
        New-Item -ItemType Directory -Path $payloadDir | Out-Null
        Set-Content -LiteralPath (Join-Path $payloadDir 'hello.txt') -Value 'hello-silent'

        # register_arp: false keeps this independent of PolyInstall.Uninstall, which neither CI callers
        # nor every release RID necessarily publish for this smoke.
        $manifestLines = @(
          'metadata:'
          '  name: SilentSmoke'
          '  version: 0.0.1'
          '  publisher: CI'
          'build:'
          '  output_dir: dist'
          '  compression: brotli'
          '  targets:'
          "    - $target"
          '  windows:'
          '    install_scope: user'
          '    register_arp: false'
          'ui:'
          '  mode: silent'
          '  wizard_steps:'
          '    - type: destination'
          '      default_path: "{LocalAppData}/SilentSmoke"'
          '    - type: progress'
          'files:'
          '  - source_dir: payload'
          '    include: ["**/*"]'
        )
        Set-Content -LiteralPath $manifestPath -Value $manifestLines

        & $polyinstallPath build $manifestPath --base $work --stubs $stubsDir
        if ($LASTEXITCODE -ne 0) { throw "polyinstall build (silent) failed with exit $LASTEXITCODE" }

        $installer = Get-ChildItem -Path (Join-Path $work 'dist') -File | Select-Object -First 1
        if ($null -eq $installer) { throw "Silent installer was not produced under dist/" }
        if ($IsLinux -or $IsMacOS) { chmod +x $installer.FullName }

        $installDir = Join-Path $work 'install-root'
        New-Item -ItemType Directory -Path $installDir | Out-Null
        $exitCode = Invoke-Stub -Path $installer.FullName -Arguments @('--install-dir', $installDir)
        if ($exitCode -ne 0) { throw "Silent installer failed with exit $exitCode" }
        if (!(Test-Path -LiteralPath (Join-Path $installDir 'hello.txt'))) {
          throw "Silent install did not copy hello.txt"
        }
        if (!(Test-Path -LiteralPath (Join-Path (Join-Path $installDir '.polyinstall') 'install-state.json'))) {
          throw "Silent install did not write install-state.json"
        }

        # Negative: unknown argument -> exit 2. Checked against the silent installer before the dist/ folder is
        # wiped and rebuilt below — both builds share the same default output_name ("{name}-{target}"), so
        # $installer's path would otherwise end up pointing at the wizard stub's bytes by the time this runs.
        $exitCode = Invoke-Stub -Path $installer.FullName -Arguments @('--not-a-real-flag')
        if ($exitCode -ne 2) { throw "Expected exit 2 for invalid args, got $exitCode" }

        # Wizard stub --silent should also succeed against a fresh destination.
        $installDir2 = Join-Path $work 'install-root-wizard-silent'
        New-Item -ItemType Directory -Path $installDir2 | Out-Null
        $wizardManifest = Join-Path $work 'wizard.yaml'
        (Get-Content -LiteralPath $manifestPath -Raw) -replace 'mode: silent', 'mode: wizard' |
          Set-Content -LiteralPath $wizardManifest
        Remove-Item -LiteralPath (Join-Path $work 'dist') -Recurse -Force -ErrorAction SilentlyContinue
        & $polyinstallPath build $wizardManifest --base $work --stubs $stubsDir
        if ($LASTEXITCODE -ne 0) { throw "polyinstall build (wizard) failed with exit $LASTEXITCODE" }
        $wizardInstaller = Get-ChildItem -Path (Join-Path $work 'dist') -File | Select-Object -First 1
        if ($IsLinux -or $IsMacOS) { chmod +x $wizardInstaller.FullName }
        $exitCode = Invoke-Stub -Path $wizardInstaller.FullName -Arguments @('--silent', '--install-dir', $installDir2)
        if ($exitCode -ne 0) { throw "Wizard stub --silent failed with exit $exitCode" }
        if (!(Test-Path -LiteralPath (Join-Path $installDir2 'hello.txt'))) {
          throw "Wizard --silent install did not copy hello.txt"
        }

        Write-Host "Silent install smoke OK ($target)."
