# Release workflow publishes self-contained polyinstall CLI zips and installer stubs once "Build, Test & Coverage"
# (build-and-test.yml) has gone green for the commit on master — that workflow is the single source of truth for
# "is this commit releasable" across Windows, Linux, and macOS, so this workflow does not run its own test job and
# does not duplicate CI. workflow_dispatch remains available for a manual re-run, restricted to master.
# Each CLI zip bundles only the stub for its host RID (e.g. polyinstall-win-x64 contains stubs/win-x64). Cross-platform
# stubs are also published standalone as stubs-{rid}.zip artifacts for users who need them (see publish job).
name: Generate Release

on:
  workflow_run:
    workflows: ["Build, Test & Coverage"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: generate-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      should_release: ${{ steps.parse.outputs.should_release }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      - id: resolve-sha
        name: Resolve commit under test
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "${GITHUB_OUTPUT}"
          else
            echo "sha=${{ github.sha }}" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.resolve-sha.outputs.sha }}

      - id: parse
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*<Version>\([^<]*\)<\/Version>.*/\1/p' src/Directory.Build.props | head -1)
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Could not parse <Version> from src/Directory.Build.props"
            exit 1
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::<Version> '${VERSION}' in src/Directory.Build.props is not valid SemVer (expected MAJOR.MINOR.PATCH[-prerelease][+build])."
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Remote tag ${TAG} already exists — skipping release."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "No remote tag ${TAG} — will create release."
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          fi

          # SemVer: any hyphen before build metadata marks a prerelease (-alpha, -beta, -rc.1, ...).
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

  publish:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            artifact: polyinstall-win-x64
          - rid: linux-x64
            artifact: polyinstall-linux-x64
          - rid: osx-arm64
            artifact: polyinstall-osx-arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.sha }}

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Publish CLI (${{ matrix.rid }})
        shell: bash
        run: >
          dotnet publish src/PolyInstall.Cli/PolyInstall.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -o "./publish/${{ matrix.artifact }}"

      - name: Install llvm-lipo for macOS native thinning
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y llvm
          if command -v llvm-lipo >/dev/null 2>&1; then
            echo "LIPO_TOOL=llvm-lipo" >> "${GITHUB_ENV}"
          else
            tool="$(command -v llvm-lipo-18 || command -v llvm-lipo-17 || command -v llvm-lipo-16 || true)"
            if [[ -z "${tool}" ]]; then
              echo "::error::llvm-lipo not found after installing llvm"
              exit 1
            fi
            echo "LIPO_TOOL=${tool}" >> "${GITHUB_ENV}"
          fi

      # Publishes stubs once per RID and reuses the bundled copy for the standalone stubs-<rid>.zip, instead of
      # running every stub publish a second time in a separate job.
      - name: Publish runtime stubs (bundled + standalone)
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          bundled_root="./publish/${ARTIFACT}/stubs/${RID}"
          LIPO_ARGS=()
          if [[ "${RID}" == osx-* ]]; then
            LIPO_ARGS+=(-p:PolyInstallThinMacNatives=true)
            if [[ -n "${LIPO_TOOL:-}" ]]; then
              LIPO_ARGS+=(-p:PolyInstallLipoTool="${LIPO_TOOL}")
            fi
          fi

          for proj in PolyInstall.Runtime PolyInstall.Runtime.Silent; do
            echo "Publishing ${proj} for ${RID}..."
            dotnet publish "src/${proj}/${proj}.csproj" \
              -c Release \
              -r "${RID}" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:EnableCompressionInSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:DebugType=none \
              "${LIPO_ARGS[@]}" \
              -o "${bundled_root}"
          done

          if [[ "${RID}" == "win-x64" ]]; then
            echo "Publishing PolyInstall.Uninstall for win-x64..."
            dotnet publish src/PolyInstall.Uninstall/PolyInstall.Uninstall.csproj \
              -c Release \
              -r win-x64 \
              -o "${bundled_root}" \
              -p:DebugType=none
          fi

          mkdir -p "stubs-output"
          cp -r "${bundled_root}" "stubs-output/${RID}"

      - name: Zip CLI artifact
        shell: bash
        env:
          TAG: ${{ needs.version-check.outputs.tag }}
        run: |
          set -euo pipefail
          cd publish
          zip -r "../${{ matrix.artifact }}-${TAG}.zip" "${{ matrix.artifact }}"

      - name: Zip stub artifact
        shell: bash
        env:
          TAG: ${{ needs.version-check.outputs.tag }}
        run: |
          set -euo pipefail
          cd stubs-output
          zip -r "../stubs-${{ matrix.rid }}-${TAG}.zip" "${{ matrix.rid }}"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-${{ needs.version-check.outputs.tag }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload stub artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: stubs-${{ matrix.rid }}
          path: stubs-${{ matrix.rid }}-${{ needs.version-check.outputs.tag }}.zip
          if-no-files-found: error
          retention-days: 7

  smoke-release-artifacts:
    needs: [version-check, publish]
    if: needs.version-check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: polyinstall-win-x64
            exe: polyinstall.exe
            runtime: PolyInstall.Runtime.exe
            silent: PolyInstall.Runtime.Silent.exe
            manifest_target: windows-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: polyinstall-linux-x64
            exe: polyinstall
            runtime: PolyInstall.Runtime
            silent: PolyInstall.Runtime.Silent
            manifest_target: linux-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: polyinstall-osx-arm64
            exe: polyinstall
            runtime: PolyInstall.Runtime
            silent: PolyInstall.Runtime.Silent
            manifest_target: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.sha }}

      - name: Download CLI artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: cli-artifact

      - name: Download stub artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: stubs-${{ matrix.rid }}
          path: stub-artifact

      - id: layout
        name: Verify release zip layout and signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ needs.version-check.outputs.tag }}'
          $rid = '${{ matrix.rid }}'
          $artifact = '${{ matrix.artifact }}'
          $exeName = '${{ matrix.exe }}'
          $runtimeName = '${{ matrix.runtime }}'
          $silentName = '${{ matrix.silent }}'

          $cliZip = Join-Path 'cli-artifact' "$artifact-$tag.zip"
          $stubZip = Join-Path 'stub-artifact' "stubs-$rid-$tag.zip"
          if (!(Test-Path -LiteralPath $cliZip)) { throw "CLI zip not found: $cliZip" }
          if (!(Test-Path -LiteralPath $stubZip)) { throw "Stub zip not found: $stubZip" }

          Expand-Archive -LiteralPath $cliZip -DestinationPath 'cli-extract' -Force
          Expand-Archive -LiteralPath $stubZip -DestinationPath 'stub-extract' -Force

          $exePath = Join-Path (Join-Path 'cli-extract' $artifact) $exeName
          # polyinstall build --stubs expects the stubs ROOT (one <rid>/ folder per target) and appends <rid>
          # itself, so emit the root here. The bundled stubs live under cli-extract/<artifact>/stubs/<rid>/.
          $stubsRoot = Join-Path (Join-Path 'cli-extract' $artifact) 'stubs'
          $stubsDir = Join-Path $stubsRoot $rid
          $bundledRuntime = Join-Path $stubsDir $runtimeName
          $bundledSilent = Join-Path $stubsDir $silentName
          $stubRuntime = Join-Path (Join-Path 'stub-extract' $rid) $runtimeName
          $stubSilent = Join-Path (Join-Path 'stub-extract' $rid) $silentName
          if (!(Test-Path -LiteralPath $exePath)) { throw "polyinstall executable not found: $exePath" }
          if (!(Test-Path -LiteralPath $bundledRuntime)) { throw "bundled runtime stub not found: $bundledRuntime" }
          if (!(Test-Path -LiteralPath $bundledSilent)) { throw "bundled silent stub not found: $bundledSilent" }
          if (!(Test-Path -LiteralPath $stubRuntime)) { throw "standalone runtime stub not found: $stubRuntime" }
          if (!(Test-Path -LiteralPath $stubSilent)) { throw "standalone silent stub not found: $stubSilent" }

          if ($rid -eq 'win-x64') {
            $bundledUninstall = Join-Path (Split-Path -Parent $bundledRuntime) 'PolyInstall.Uninstall.exe'
            $stubUninstall = Join-Path (Split-Path -Parent $stubRuntime) 'PolyInstall.Uninstall.exe'
            if (!(Test-Path -LiteralPath $bundledUninstall)) { throw "bundled uninstall stub not found: $bundledUninstall" }
            if (!(Test-Path -LiteralPath $stubUninstall)) { throw "standalone uninstall stub not found: $stubUninstall" }
          }

          if ($IsLinux -or $IsMacOS) {
            chmod +x $exePath
            chmod +x $bundledRuntime
            chmod +x $bundledSilent
            chmod +x $stubRuntime
            chmod +x $stubSilent
          }

          if ($rid -eq 'osx-arm64') {
            $arch = (& uname -m).Trim()
            if ($arch -ne 'arm64') {
              throw "Expected an arm64 macOS runner for the osx-arm64 release leg, but 'uname -m' reported '$arch'. This leg must fail loudly rather than silently skip thinning/signature coverage — pin the runner to an Apple Silicon image."
            }

            # Extract single-file natives and assert they are arm64-only with intact ad-hoc signatures.
            $extractBase = Join-Path $env:RUNNER_TEMP "polyinstall-thin-check"
            if (Test-Path -LiteralPath $extractBase) { Remove-Item -LiteralPath $extractBase -Recurse -Force }
            New-Item -ItemType Directory -Path $extractBase | Out-Null
            $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = $extractBase
            & $stubRuntime 2>$null | Out-Null
            Remove-Item Env:DOTNET_BUNDLE_EXTRACT_BASE_DIR -ErrorAction SilentlyContinue
            $dylibs = Get-ChildItem -Path $extractBase -Filter '*.dylib' -Recurse -ErrorAction SilentlyContinue
            if ($dylibs.Count -eq 0) { throw "No .dylib files extracted from osx-arm64 stub under $extractBase" }
            foreach ($dylib in $dylibs) {
              $archs = (& lipo -archs $dylib.FullName).Trim()
              if ($archs -ne 'arm64') {
                throw "Expected thinned dylib $($dylib.Name) to be arm64-only, got: $archs"
              }
              & codesign --verify $dylib.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "codesign --verify failed for $($dylib.FullName)"
              }
              Write-Host "Thinned OK: $($dylib.Name) ($archs)"
            }
          }

          & $exePath --version

          Add-Content -Path $env:GITHUB_OUTPUT -Value "exe-path=$exePath"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "stubs-dir=$stubsRoot"

      - name: Silent install smoke (release artifacts)
        uses: ./.github/actions/silent-smoke
        with:
          polyinstall-path: ${{ steps.layout.outputs.exe-path }}
          stubs-dir: ${{ steps.layout.outputs.stubs-dir }}
          manifest-target: ${{ matrix.manifest_target }}

  release:
    needs: [version-check, publish, smoke-release-artifacts]
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.version-check.outputs.sha }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: release-zips
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-zips
          sha256sum *.zip | sort -k2 > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "release-zips/*.zip"

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.version-check.outputs.tag }}"
          REPO="${{ github.repository }}"
          TARGET="${{ needs.version-check.outputs.sha }}"

          # gh has no "release generate-notes" subcommand; the generated-notes preview lives behind the REST API.
          set +e
          gh api --method POST "repos/${REPO}/releases/generate-notes" \
            -f tag_name="${TAG}" -f target_commitish="${TARGET}" --jq .body > notes.md 2>/dev/null
          GH_RC=$?
          set -e

          if [[ ${GH_RC} -eq 0 ]] && [[ -s notes.md ]]; then
            echo "Using GitHub-generated release notes."
          else
            echo "Using commit-message fallback for release notes."
            git fetch --tags --force origin
            {
              echo "## Changes"
              echo ""
              PREV=$(git tag -l 'v*' --sort=-version:refname | head -1 || true)
              if [[ -n "${PREV}" ]]; then
                git log "${PREV}".."${TARGET}" --pretty=format:'- %s (%h)' || true
              else
                git log -50 --pretty=format:'- %s (%h)' "${TARGET}" || true
              fi
            } > notes.md
          fi

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version-check.outputs.tag }}
          name: PolyInstall ${{ needs.version-check.outputs.tag }}
          target_commitish: ${{ needs.version-check.outputs.sha }}
          prerelease: ${{ needs.version-check.outputs.prerelease == 'true' }}
          body_path: notes.md
          draft: false
          make_latest: ${{ needs.version-check.outputs.prerelease != 'true' }}
          fail_on_unmatched_files: true
          files: |
            release-zips/**/*.zip
            release-zips/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}
