# Release workflow builds/tests the solution and publishes self-contained polyinstall CLI zips. Each zip bundles
# PolyInstall.Runtime under stubs/<rid>/ for every release RID (win-x64, linux-x64, osx-arm64), plus
# PolyInstall.Uninstall under stubs/win-x64/, so any platform's CLI can build installers for all targets.
name: Generate Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: generate-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      should_release: ${{ steps.parse.outputs.should_release }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6

      - id: parse
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*<Version>\([^<]*\)<\/Version>.*/\1/p' src/Directory.Build.props | head -1)
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Could not parse <Version> from src/Directory.Build.props"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Remote tag ${TAG} already exists — skipping release."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "No remote tag ${TAG} — will create release."
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          fi

          LOWER="${VERSION,,}"
          if [[ "${LOWER}" == *"-alpha"* || "${LOWER}" == *"-beta"* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

  test:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      # squashfs-tools / mksquashfs are only needed when running polyinstall to build AppImages
      # (manifest linux.package: appimage). dotnet restore/build/test does not invoke that path.
      - run: dotnet restore src/PolyInstall.slnx
      - run: dotnet build src/PolyInstall.slnx -c Release --no-restore
      - name: Test with coverage
        run: >
          dotnet test src/PolyInstall.slnx
          -c Release --no-build --verbosity normal
          /p:CollectCoverage=true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: ./src/coverage/**/coverage.cobertura.xml
          flags: unittests-${{ matrix.os }}
          name: polyinstall-coverage-${{ matrix.os }}

  publish:
    needs: [version-check, test]
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            artifact: polyinstall-win-x64
          - rid: linux-x64
            artifact: polyinstall-linux-x64
          - rid: osx-arm64
            artifact: polyinstall-osx-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      # mksquashfs is only required on hosts that run polyinstall with AppImage packaging enabled,
      # not for dotnet publish of the CLI itself (see AppImagePackager / InstallerBuildPipeline).

      - name: Publish CLI (${{ matrix.rid }})
        run: >
          dotnet publish src/PolyInstall.Cli/PolyInstall.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -o "./publish/${{ matrix.artifact }}"

      - name: Publish runtime stubs (all release RIDs)
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          stubs_root="./publish/${ARTIFACT}/stubs"
          for rid in win-x64 linux-x64 osx-arm64; do
            echo "Publishing PolyInstall.Runtime for ${rid}..."
            dotnet publish src/PolyInstall.Runtime/PolyInstall.Runtime.csproj \
              -c Release \
              -r "${rid}" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -o "${stubs_root}/${rid}"
          done

      - name: Publish Windows uninstall stub (into stubs/win-x64)
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          stubs_root="./publish/${ARTIFACT}/stubs"
          dotnet publish src/PolyInstall.Uninstall/PolyInstall.Uninstall.csproj \
            -c Release \
            -r win-x64 \
            -o "${stubs_root}/win-x64"

      - name: Zip artifact
        env:
          TAG: ${{ needs.version-check.outputs.tag }}
        run: |
          cd publish
          zip -r "../${{ matrix.artifact }}-${TAG}.zip" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-${{ needs.version-check.outputs.tag }}.zip

  release:
    needs: [version-check, publish]
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-zips
          merge-multiple: true

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.version-check.outputs.tag }}"
          REPO="${{ github.repository }}"
          TARGET="${{ github.sha }}"

          set +e
          gh release generate-notes --repo "${REPO}" --tag "${TAG}" --target "${TARGET}" > notes.md 2>/dev/null
          GH_RC=$?
          set -e

          if [[ ${GH_RC} -eq 0 ]] && [[ -s notes.md ]]; then
            echo "Using GitHub-generated release notes."
          else
            echo "Using commit-message fallback for release notes."
            git fetch --tags --force origin
            {
              echo "## Changes"
              echo ""
              PREV=$(git tag -l 'v*' --sort=-version:refname | head -1 || true)
              if [[ -n "${PREV}" ]]; then
                git log "${PREV}".."${TARGET}" --pretty=format:'- %s (%h)' || true
              else
                git log -50 --pretty=format:'- %s (%h)' "${TARGET}" || true
              fi
            } > notes.md
          fi

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version-check.outputs.tag }}
          name: ${{ needs.version-check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.version-check.outputs.prerelease == 'true' }}
          body_path: notes.md
          draft: false
          fail_on_unmatched_files: true
          files: release-zips/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
