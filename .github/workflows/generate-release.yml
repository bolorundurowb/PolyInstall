# Release workflow builds/tests the solution and publishes self-contained polyinstall CLI zips.
# Each CLI zip bundles only the stub for its host RID (e.g. polyinstall-win-x64 contains stubs/win-x64).
# Cross-platform stubs are published separately as stubs-{rid}.zip artifacts for users who need them.
name: Generate Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: generate-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      should_release: ${{ steps.parse.outputs.should_release }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6

      - id: parse
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*<Version>\([^<]*\)<\/Version>.*/\1/p' src/Directory.Build.props | head -1)
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Could not parse <Version> from src/Directory.Build.props"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Remote tag ${TAG} already exists — skipping release."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "No remote tag ${TAG} — will create release."
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          fi

          LOWER="${VERSION,,}"
          if [[ "${LOWER}" == *"-alpha"* || "${LOWER}" == *"-beta"* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

  test:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - run: dotnet restore src/PolyInstall.slnx
      - run: dotnet build src/PolyInstall.slnx -c Release --no-restore
      - name: Test with coverage
        run: >
          dotnet test src/PolyInstall.slnx
          -c Release --no-build --verbosity normal
          /p:CollectCoverage=true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: ./src/coverage/**/coverage.cobertura.xml
          flags: unittests-${{ matrix.os }}
          name: polyinstall-coverage-${{ matrix.os }}

  publish:
    needs: [version-check, test]
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            artifact: polyinstall-win-x64
          - rid: linux-x64
            artifact: polyinstall-linux-x64
          - rid: osx-arm64
            artifact: polyinstall-osx-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Publish CLI (${{ matrix.rid }})
        run: >
          dotnet publish src/PolyInstall.Cli/PolyInstall.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -o "./publish/${{ matrix.artifact }}"

      - name: Publish runtime stub for host RID
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          stubs_root="./publish/${ARTIFACT}/stubs"
          echo "Publishing PolyInstall.Runtime for ${RID}..."
          dotnet publish src/PolyInstall.Runtime/PolyInstall.Runtime.csproj \
            -c Release \
            -r "${RID}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -o "${stubs_root}/${RID}"

      - name: Publish Windows uninstall stub (win-x64 only)
        if: matrix.rid == 'win-x64'
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          stubs_root="./publish/${ARTIFACT}/stubs/win-x64"
          dotnet publish src/PolyInstall.Uninstall/PolyInstall.Uninstall.csproj \
            -c Release \
            -r win-x64 \
            -o "${stubs_root}" \
            -p:DebugType=none

      - name: Zip artifact
        env:
          TAG: ${{ needs.version-check.outputs.tag }}
        run: |
          cd publish
          zip -r "../${{ matrix.artifact }}-${TAG}.zip" "${{ matrix.artifact }}"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-${{ needs.version-check.outputs.tag }}.zip

  publish-stubs:
    needs: [version-check, test]
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Publish runtime stub (${{ matrix.rid }})
        run: |
          set -euo pipefail
          out="./stubs-output/${{ matrix.rid }}"
          dotnet publish src/PolyInstall.Runtime/PolyInstall.Runtime.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -o "${out}"

      - name: Publish Windows uninstall stub (win-x64 only)
        if: matrix.rid == 'win-x64'
        run: |
          set -euo pipefail
          out="./stubs-output/win-x64"
          dotnet publish src/PolyInstall.Uninstall/PolyInstall.Uninstall.csproj \
            -c Release \
            -r win-x64 \
            -o "${out}" \
            -p:DebugType=none

      - name: Zip stub artifact
        env:
          TAG: ${{ needs.version-check.outputs.tag }}
        run: |
          cd stubs-output
          zip -r "../stubs-${{ matrix.rid }}-${TAG}.zip" "${{ matrix.rid }}"

      - name: Upload stub artifact
        uses: actions/upload-artifact@v6
        with:
          name: stubs-${{ matrix.rid }}
          path: stubs-${{ matrix.rid }}-${{ needs.version-check.outputs.tag }}.zip

  smoke-release-artifacts:
    needs: [version-check, publish, publish-stubs]
    if: needs.version-check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: polyinstall-win-x64
            exe: polyinstall.exe
            runtime: PolyInstall.Runtime.exe
          - os: ubuntu-latest
            rid: linux-x64
            artifact: polyinstall-linux-x64
            exe: polyinstall
            runtime: PolyInstall.Runtime
          - os: macos-latest
            rid: osx-arm64
            artifact: polyinstall-osx-arm64
            exe: polyinstall
            runtime: PolyInstall.Runtime
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download CLI artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: cli-artifact

      - name: Download stub artifact
        uses: actions/download-artifact@v7
        with:
          name: stubs-${{ matrix.rid }}
          path: stub-artifact

      - name: Smoke test release zips
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ needs.version-check.outputs.tag }}'
          $rid = '${{ matrix.rid }}'
          $artifact = '${{ matrix.artifact }}'
          $exeName = '${{ matrix.exe }}'
          $runtimeName = '${{ matrix.runtime }}'

          $cliZip = Join-Path 'cli-artifact' "$artifact-$tag.zip"
          $stubZip = Join-Path 'stub-artifact' "stubs-$rid-$tag.zip"
          if (!(Test-Path -LiteralPath $cliZip)) { throw "CLI zip not found: $cliZip" }
          if (!(Test-Path -LiteralPath $stubZip)) { throw "Stub zip not found: $stubZip" }

          Expand-Archive -LiteralPath $cliZip -DestinationPath 'cli-extract' -Force
          Expand-Archive -LiteralPath $stubZip -DestinationPath 'stub-extract' -Force

          $exePath = Join-Path (Join-Path 'cli-extract' $artifact) $exeName
          $bundledRuntime = Join-Path (Join-Path (Join-Path (Join-Path 'cli-extract' $artifact) 'stubs') $rid) $runtimeName
          $stubRuntime = Join-Path (Join-Path 'stub-extract' $rid) $runtimeName
          if (!(Test-Path -LiteralPath $exePath)) { throw "polyinstall executable not found: $exePath" }
          if (!(Test-Path -LiteralPath $bundledRuntime)) { throw "bundled runtime stub not found: $bundledRuntime" }
          if (!(Test-Path -LiteralPath $stubRuntime)) { throw "standalone runtime stub not found: $stubRuntime" }

          if ($rid -eq 'win-x64') {
            $bundledUninstall = Join-Path (Split-Path -Parent $bundledRuntime) 'PolyInstall.Uninstall.exe'
            $stubUninstall = Join-Path (Split-Path -Parent $stubRuntime) 'PolyInstall.Uninstall.exe'
            if (!(Test-Path -LiteralPath $bundledUninstall)) { throw "bundled uninstall stub not found: $bundledUninstall" }
            if (!(Test-Path -LiteralPath $stubUninstall)) { throw "standalone uninstall stub not found: $stubUninstall" }
          }

          if ($IsLinux -or $IsMacOS) {
            chmod +x $exePath
          }

          if ($rid -eq 'osx-arm64') {
            $arch = (& uname -m).Trim()
            if ($arch -ne 'arm64') {
              Write-Host "Skipping osx-arm64 execution on $arch runner after layout verification."
              exit 0
            }
          }

          & $exePath --version

  release:
    needs: [version-check, publish, publish-stubs, smoke-release-artifacts]
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-zips
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-zips
          sha256sum *.zip | sort -k2 > SHA256SUMS.txt

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.version-check.outputs.tag }}"
          REPO="${{ github.repository }}"
          TARGET="${{ github.sha }}"

          set +e
          gh release generate-notes --repo "${REPO}" --tag "${TAG}" --target "${TARGET}" > notes.md 2>/dev/null
          GH_RC=$?
          set -e

          if [[ ${GH_RC} -eq 0 ]] && [[ -s notes.md ]]; then
            echo "Using GitHub-generated release notes."
          else
            echo "Using commit-message fallback for release notes."
            git fetch --tags --force origin
            {
              echo "## Changes"
              echo ""
              PREV=$(git tag -l 'v*' --sort=-version:refname | head -1 || true)
              if [[ -n "${PREV}" ]]; then
                git log "${PREV}".."${TARGET}" --pretty=format:'- %s (%h)' || true
              else
                git log -50 --pretty=format:'- %s (%h)' "${TARGET}" || true
              fi
            } > notes.md
          fi

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version-check.outputs.tag }}
          name: PolyInstall ${{ needs.version-check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.version-check.outputs.prerelease == 'true' }}
          body_path: notes.md
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-zips/**/*.zip
            release-zips/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
