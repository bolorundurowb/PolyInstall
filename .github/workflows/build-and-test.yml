# CI restores/builds/tests PolyInstall.slnx (includes PolyInstall.Runtime, PolyInstall.Uninstall, CLI, UI, Core, tests).
name: Build, Test & Coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore src/PolyInstall.slnx

      - name: Build
        run: dotnet build src/PolyInstall.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test src/PolyInstall.slnx
          --configuration Release
          --no-build
          --verbosity normal
          /p:CollectCoverage=true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: ./src/coverage/**/coverage.cobertura.xml
          flags: unittests
          name: polyinstall-coverage
