# CI restores/builds/tests PolyInstall.slnx (includes PolyInstall.Runtime, PolyInstall.Uninstall, CLI, UI, Core, tests).
name: Build, Test & Coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: polyinstall-linux-x64
          - os: windows-latest
            rid: win-x64
            artifact: polyinstall-win-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: polyinstall-osx-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore src/PolyInstall.slnx

      - name: Build
        run: dotnet build src/PolyInstall.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test src/PolyInstall.slnx
          --configuration Release
          --no-build
          --verbosity normal
          /p:CollectCoverage=true

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: ./src/coverage/**/coverage.cobertura.xml
          flags: unittests
          name: polyinstall-coverage

      - name: Publish CLI fixture for setup action
        if: runner.os != 'macOS'
        run: >
          dotnet publish src/PolyInstall.Cli/PolyInstall.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          --output ./setup-action-smoke/${{ matrix.artifact }}

      - name: Package setup action fixture
        if: runner.os != 'macOS'
        shell: pwsh
        working-directory: setup-action-smoke
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = '${{ matrix.artifact }}-v0.0.0-test.zip'
          Compress-Archive -Path '${{ matrix.artifact }}' -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -NoNewline -Path SHA256SUMS.txt

      - id: setup-polyinstall-smoke
        name: Smoke test setup-polyinstall action
        if: runner.os != 'macOS'
        uses: ./.github/actions/setup-polyinstall
        with:
          version: v0.0.0-test
          rid: ${{ matrix.rid }}
          asset-dir: setup-action-smoke
          install-dir: ${{ runner.temp }}/setup-polyinstall-smoke

      - name: Verify setup action PATH
        if: runner.os != 'macOS'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $polyinstall = '${{ steps.setup-polyinstall-smoke.outputs.polyinstall-path }}'
          if (!(Test-Path -LiteralPath $polyinstall)) {
            throw "polyinstall executable not found: $polyinstall"
          }
          & $polyinstall --version
          polyinstall --version
