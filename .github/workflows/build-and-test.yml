# CI restores/builds/tests PolyInstall.slnx (includes PolyInstall.Runtime, PolyInstall.Uninstall, CLI, UI, Core, tests).
name: Build, Test & Coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore src/PolyInstall.slnx

      - name: Build
        run: dotnet build src/PolyInstall.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test src/PolyInstall.slnx
          --configuration Release
          --no-build
          --verbosity normal
          /p:CollectCoverage=true

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: ./src/coverage/**/coverage.cobertura.xml
          flags: unittests
          name: polyinstall-coverage

      - name: Publish CLI fixture for setup action
        if: runner.os == 'Linux'
        run: >
          dotnet publish src/PolyInstall.Cli/PolyInstall.Cli.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          --output ./setup-action-smoke/polyinstall-linux-x64

      - name: Package setup action fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd setup-action-smoke
          zip -r polyinstall-linux-x64-v0.0.0-test.zip polyinstall-linux-x64
          sha256sum polyinstall-linux-x64-v0.0.0-test.zip > SHA256SUMS.txt

      - id: setup-polyinstall-smoke
        name: Smoke test setup-polyinstall action
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-polyinstall
        with:
          version: v0.0.0-test
          rid: linux-x64
          asset-dir: setup-action-smoke
          install-dir: ${{ runner.temp }}/setup-polyinstall-smoke

      - name: Verify setup action PATH
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -x "${{ steps.setup-polyinstall-smoke.outputs.polyinstall-path }}"
          polyinstall --version
