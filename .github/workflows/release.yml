# Create a GitHub Release when a version tag v* is pushed (e.g. v1.2.3).
# Publishes self-contained single-file CLI builds for common RIDs and attaches them as assets.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - run: dotnet restore PolyInstall.slnx
      - run: dotnet build PolyInstall.slnx -c Release --no-restore
      - run: dotnet test PolyInstall.slnx -c Release --no-build --verbosity normal

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            artifact: polyinstall-win-x64
          - rid: linux-x64
            artifact: polyinstall-linux-x64
          - rid: osx-arm64
            artifact: polyinstall-osx-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Install squashfs-tools (AppImage / CLI packaging)
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Publish CLI (${{ matrix.rid }})
        run: >
          dotnet publish src/PolyInstall.Cli/PolyInstall.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -o "./publish/${{ matrix.artifact }}"

      - name: Zip artifact
        run: |
          cd publish
          zip -r "../${{ matrix.artifact }}-${{ github.ref_name }}.zip" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-${{ github.ref_name }}.zip

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-zips
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-zips/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
